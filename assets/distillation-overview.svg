<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">BRIGHT-Flash 跨倍率蒸馏方法图</title><desc id="desc">教师冻结，学生更新；16 教师 CLS 聚合为 1，学生 16 Patch 与教师 16 tile Patch 目标对应。交叉配对待核对。</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#becabc" stroke-width=".5" opacity=".35"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#156a70"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183e43}.muted{fill:#5e746b}.label{font-size:14px;letter-spacing:2px}.small{font-size:14px}.title{font-size:30px;font-weight:500}.body{font-size:18px}</style><rect width="1280" height="720" fill="#f5f4ef"/><rect x="35" y="100" width="1210" height="520" rx="10" fill="url(#grid)"/><text x="50" y="55" class="title">BRIGHT-Flash · 跨倍率交叉蒸馏</text><text x="50" y="85" class="small muted">结构依据用户说明；交叉配对、聚合算子、投影维度与权重待原实现核对</text><rect x="60" y="150" width="280" height="120" rx="7" fill="#e4eee5" stroke="#b8c9be"/><text x="80" y="193" class="body">20× H-optimus-1</text><text x="80" y="226" class="small muted">冻结教师 · 16 tiles</text><rect x="60" y="410" width="280" height="120" rx="7" fill="#eeeadc" stroke="#b8c9be"/><text x="80" y="453" class="body">5× BRIGHT-Flash-ex</text><text x="80" y="486" class="small muted">可训练学生 · 1 tile</text><rect x="410" y="140" width="320" height="100" rx="7" fill="#e4eee5" stroke="#b8c9be"/><text x="430" y="183" class="body">16 CLS → 聚合 → 1 CLS</text><text x="430" y="216" class="small muted">具体聚合算子待核对</text><rect x="410" y="290" width="320" height="100" rx="7" fill="#e4eee5" stroke="#b8c9be"/><text x="430" y="333" class="body">16 tile 的 Patch 目标</text><text x="430" y="366" class="small muted">每 tile 目标构造待核对</text><rect x="410" y="460" width="320" height="100" rx="7" fill="#eeeadc" stroke="#b8c9be"/><text x="430" y="503" class="body">1 CLS + 16 Patch tokens</text><text x="430" y="536" class="small muted">双学生投影 P_CLS / P_Patch</text><rect x="850" y="150" width="360" height="120" rx="7" fill="#e4eee5" stroke="#b8c9be"/><text x="870" y="193" class="body">CLS ↔ CLS</text><text x="870" y="226" class="small muted">学生 1 CLS 对齐教师聚合 CLS</text><rect x="850" y="350" width="360" height="120" rx="7" fill="#e4eee5" stroke="#b8c9be"/><text x="870" y="393" class="body">Patch ↔ Patch</text><text x="870" y="426" class="small muted">学生 16 Patch ↔ 教师 16 tile 目标</text><path d="M340 190H405" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M340 235C380 235 370 340 405 340" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M340 470H405" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730 190H845" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730 340C800 340 790 400 845 400" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730 495C800 495 800 250 845 230" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730 530C800 530 800 445 845 445" stroke="#156a70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="855" y="535" class="small muted">另两路交叉配对：候选示意，待原实现核对</text><text x="60" y="655" class="body">同一物理视野 · 学生投影逼近教师目标 · 四路 cosine alignment</text><text x="60" y="687" class="small muted">不默认平均池化；不预设维度与损失权重；仅更新学生及学生投影。</text></svg>