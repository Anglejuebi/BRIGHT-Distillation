<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">P1 至 P4 受控实验设计</title><desc id="desc">两个低倍表征及对应 SNGP 选区分支，分别与两个高倍编码器组合成四组。</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#becabc" stroke-width=".5" opacity=".35"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#156a70"/></marker></defs><style>text{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183e43}.muted{fill:#5e746b}.label{font-size:14px;letter-spacing:2px}.small{font-size:14px}.title{font-size:30px;font-weight:500}.body{font-size:18px}</style><rect width="1280" height="720" fill="#f5f4ef"/><text x="55" y="60" class="title">先评测表征，再训练 SNGP，最后比较 P1–P4</text><text x="55" y="95" class="small muted">相同测试划分 · 相同候选视野 · 统一 Top-N · 同分支复用选区坐标 · 统一下游协议</text><text x="460" y="165" class="body">20× BRIGHT-S</text><text x="900" y="165" class="body">20× H-optimus-1</text><rect x="300" y="200" width="415" height="155" rx="7" fill="#e6efeb" stroke="#bfd0c6"/><text x="322" y="245" class="title">P1</text><text x="322" y="285" class="body">5× 1007 → SNGP-1007</text><text x="322" y="320" class="body">统一 Top-N → 20× BRIGHT-S</text><rect x="760" y="200" width="415" height="155" rx="7" fill="#e6efeb" stroke="#bfd0c6"/><text x="782" y="245" class="title">P2</text><text x="782" y="285" class="body">5× 1007 → SNGP-1007</text><text x="782" y="320" class="body">统一 Top-N → 20× H-optimus-1</text><rect x="300" y="390" width="415" height="155" rx="7" fill="#eeeadc" stroke="#bfd0c6"/><text x="322" y="435" class="title">P3</text><text x="322" y="475" class="body">5× ex → SNGP-ex</text><text x="322" y="510" class="body">统一 Top-N → 20× BRIGHT-S</text><rect x="760" y="390" width="415" height="155" rx="7" fill="#eeeadc" stroke="#bfd0c6"/><text x="782" y="435" class="title">P4</text><text x="782" y="475" class="body">5× ex → SNGP-ex</text><text x="782" y="510" class="body">统一 Top-N → 20× H-optimus-1</text><text x="55" y="265" class="body">1007 分支</text><text x="55" y="455" class="body">ex 分支</text><text x="55" y="610" class="body">P3 vs P1 / P4 vs P2：选区分支联合效应</text><text x="55" y="645" class="body">P2 vs P1 / P4 vs P3：下游 20× 编码器效应</text><text x="55" y="685" class="small muted">数据扩充与蒸馏教师替换的独立贡献需另设消融。所有性能结果均待测。</text></svg>